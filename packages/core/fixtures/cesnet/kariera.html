<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><title>Example | Career</title></head>
<body>
<h2>Open positions</h2>
<div class="career-filters"><a href="#">Praha</a></div>
<div class="list-items list-items--plus-minus">
  <div id="no-career-position" class="list-items__item hidden"><p>No position for this place.</p></div>
  <div class="list-items__item praha brno">
    <div class="list-items__item__head">
      <h3 tabindex="0" onclick="history.replaceState(null,null,'#product-manager-m-z');return false;">Product manager (m/ž) </h3>
      <div id="product-manager-m-z" class="icon icon-round icon--plus-minus"></div>
    </div>
    <div class="list-items__item__body">
      <div class="location"><img class="icon" src="/img/icons/location.svg" alt="Location">Praha, Brno</div>
      <div class="list-items__item__cols">
        <div class="description"><p><span><strong>Product manager&nbsp;</strong></span></p><p>We look for a person for a full-time position.</p><ul><li>run the portfolio</li><li>talk to the teams</li></ul></div>
        <div class="buttons"><a class="button button--lightblue" href="#">Reply</a></div>
      </div>
    </div>
  </div>
  <div class="list-items__item praha">
    <div class="list-items__item__head">
      <h3 tabindex="0">Identity analyst (medior)</h3>
      <div id="identity-analyst-medior" class="icon icon-round icon--plus-minus"></div>
    </div>
    <div class="list-items__item__body">
      <div class="location">Praha</div>
      <div class="list-items__item__cols">
        <div class="description"><p>Analyse identities.</p></div>
        <div class="buttons"><a class="button button--lightblue" href="#">Reply</a></div>
      </div>
    </div>
  </div>
</div>
</body></html>
